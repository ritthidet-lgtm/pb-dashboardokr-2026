<script>
    let ceData = {};
    let currentTopic = "";
    let nodes = [];

    // --- 🌟 ระบบจัดการหัวข้อ C&E (Data Manager) 🌟 ---
    function initApp() {
        let storeStr = document.getElementById('ce-data-store').textContent;
        try {
            let data = JSON.parse(storeStr);
            ceData = data.topics;
            currentTopic = data.currentTopic;
            if(!ceData[currentTopic]) currentTopic = Object.keys(ceData)[0];
        } catch(e) {
            alert("โหลดข้อมูลล้มเหลว สร้างข้อมูลเริ่มต้นใหม่");
        }
        updateDropdown();
        loadTopic(currentTopic);
    }

    function updateDropdown() {
        let sel = document.getElementById('topicSelector');
        sel.innerHTML = '';
        for(let key in ceData) {
            let opt = document.createElement('option');
            opt.value = key;
            opt.text = ceData[key].title;
            if(key === currentTopic) opt.selected = true;
            sel.appendChild(opt);
        }
    }

    function saveCurrentState() {
        if(!ceData[currentTopic]) return;
        ceData[currentTopic].probTitle = document.getElementById('probTitle').value;
        ceData[currentTopic].probDesc = document.getElementById('probDesc').value;
        ceData[currentTopic].obsTitle = document.getElementById('obsTitle').value;
        ceData[currentTopic].obsDesc = document.getElementById('obsDesc').value;
    }

    function switchTopic(topicId) {
        saveCurrentState();
        currentTopic = topicId;
        loadTopic(currentTopic);
    }

    function loadTopic(topicId) {
        let data = ceData[topicId];
        document.getElementById('probTitle').value = data.probTitle;
        document.getElementById('probDesc').value = data.probDesc;
        document.getElementById('obsTitle').value = data.obsTitle;
        document.getElementById('obsDesc').value = data.obsDesc;
        
        nodes = data.nodes;
        renderNodes();
    }

    function createNewTopic() {
        let name = prompt("ตั้งชื่อเรื่อง C&E ใหม่ (เช่น ปั๊มน้ำเสีย, มอเตอร์ไหม้):");
        if(!name) return;
        
        saveCurrentState();
        let newId = 'topic_' + Date.now();
        ceData[newId] = {
            title: name,
            probTitle: "ปัญหา : " + name,
            probDesc: "",
            obsTitle: "ข้อสังเกต",
            obsDesc: "",
            nodes: [{ id: 'node_root', text: name, x: 50, y: 300, parentId: null, status: 'wait' }]
        };
        currentTopic = newId;
        updateDropdown();
        loadTopic(currentTopic);
    }

    function renameTopic() {
        let newName = prompt("แก้ไขชื่อเรื่อง:", ceData[currentTopic].title);
        if(newName) {
            ceData[currentTopic].title = newName;
            updateDropdown();
        }
    }

    function deleteCurrentTopic() {
        if(Object.keys(ceData).length <= 1) {
            alert("❌ ลบไม่ได้ครับ ต้องมีอย่างน้อย 1 เรื่องในระบบ");
            return;
        }
        if(confirm(`ต้องการลบเรื่อง "${ceData[currentTopic].title}" ใช่หรือไม่?\n(ข้อมูลจะหายไปทั้งหมด!)`)) {
            delete ceData[currentTopic];
            currentTopic = Object.keys(ceData)[0];
            updateDropdown();
            loadTopic(currentTopic);
        }
    }

    // --- 🌟 ระบบ C&E Tree 🌟 ---
    let draggedNode = null;
    let offsetX = 0, offsetY = 0;
    const canvas = document.getElementById('canvas');
    const svgLines = document.getElementById('svgLines');

    function renderNodes() {
        Array.from(canvas.children).forEach(child => {
            if (child.tagName !== 'svg' && child.tagName !== 'SVG') child.remove();
        });

        nodes.forEach(node => {
            let nodeDiv = document.createElement('div');
            nodeDiv.className = `node ${node.parentId === null ? 'root' : ''} status-${node.status || 'wait'}`;
            nodeDiv.id = node.id;
            nodeDiv.style.left = node.x + 'px';
            nodeDiv.style.top = node.y + 'px';
            
            nodeDiv.onmousedown = (e) => startDrag(e, node.id);
            nodeDiv.onmouseleave = () => {
                let sbox = document.getElementById('status_box_' + node.id);
                if(sbox) sbox.classList.remove('hidden-click');
            };

            let delBtnHTML = node.parentId !== null ? `<div class="btn-del-floating" onclick="deleteNode('${node.id}')" title="ลบ">❌</div>` : ``;

            nodeDiv.innerHTML = `
                ${delBtnHTML}
                <textarea placeholder="พิมพ์สาเหตุ..." oninput="updateText('${node.id}', this.value)" onmousedown="event.stopPropagation()">${node.text}</textarea>
                <div class="btn-add-node" onclick="addNode('${node.id}')" title="เพิ่มสาเหตุถัดไป">+</div>
                
                <div class="status-hover-box" id="status_box_${node.id}">
                    <button class="btn-status yes ${node.status === 'yes' ? 'active' : ''}" onclick="setStatus('${node.id}', 'yes', event)">ใช่</button>
                    <button class="btn-status no ${node.status === 'no' ? 'active' : ''}" onclick="setStatus('${node.id}', 'no', event)">ไม่ใช่</button>
                    <button class="btn-status wait ${node.status === 'wait' ? 'active' : ''}" onclick="setStatus('${node.id}', 'wait', event)">รอ</button>
                </div>
            `;
            canvas.appendChild(nodeDiv);
        });
        drawLines();
    }

    function drawLines() {
        svgLines.innerHTML = `
            <defs>
                <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
                </marker>
            </defs>
        `;
        nodes.forEach(node => {
            if (node.parentId) {
                let parent = nodes.find(n => n.id === node.parentId);
                if (parent) {
                    let parentEl = document.getElementById(parent.id);
                    let nodeEl = document.getElementById(node.id);
                    if(!parentEl || !nodeEl) return;

                    let px = parent.x + parentEl.offsetWidth; 
                    let py = parent.y + (parentEl.offsetHeight / 2); 
                    let cx = node.x;
                    let cy = node.y + (nodeEl.offsetHeight / 2);

                    let path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', `M ${px} ${py} C ${px + 30} ${py}, ${cx - 30} ${cy}, ${cx - 5} ${cy}`);
                    path.setAttribute('stroke', '#bdc3c7');
                    path.setAttribute('stroke-width', '3');
                    path.setAttribute('fill', 'none');
                    path.setAttribute('marker-end', 'url(#arrow)');
                    svgLines.appendChild(path);
                }
            }
        });
    }

    function addNode(parentId) {
        let parent = nodes.find(n => n.id === parentId);
        let newId = 'node_' + Date.now();
        let siblings = nodes.filter(n => n.parentId === parentId);
        let offsetY = siblings.length * 85; 

        nodes.push({ id: newId, text: '', x: parent.x + 220, y: parent.y + offsetY, parentId: parentId, status: 'wait' });
        ceData[currentTopic].nodes = nodes;
        renderNodes();
    }

    function deleteNode(id) {
        if(confirm('ต้องการลบกล่องนี้ใช่หรือไม่? (สาขาย่อยจะถูกเลื่อนขึ้นมาเชื่อมต่อแทน)')) {
            let nodeToDelete = nodes.find(n => n.id === id);
            if(!nodeToDelete) return;
            let parentId = nodeToDelete.parentId;
            
            nodes.forEach(n => {
                if (n.parentId === id) {
                    n.parentId = parentId;
                    n.x -= 220; 
                }
            });
            nodes = nodes.filter(n => n.id !== id);
            ceData[currentTopic].nodes = nodes;
            renderNodes();
        }
    }

    function startDrag(e, id) {
        if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON' || e.target.className === 'btn-add-node') return; 
        draggedNode = nodes.find(n => n.id === id);
        let nodeEl = document.getElementById(id);
        let rect = nodeEl.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('mouseup', stopDrag);
    }

    function onDrag(e) {
        if (!draggedNode) return;
        let containerRect = document.getElementById('canvasContainer').getBoundingClientRect();
        let newX = e.clientX - containerRect.left + document.getElementById('canvasContainer').scrollLeft - offsetX;
        let newY = e.clientY - containerRect.top + document.getElementById('canvasContainer').scrollTop - offsetY;
        
        draggedNode.x = Math.max(10, newX);
        draggedNode.y = Math.max(10, newY);
        let el = document.getElementById(draggedNode.id);
        el.style.left = draggedNode.x + 'px';
        el.style.top = draggedNode.y + 'px';
        drawLines(); 
    }

    function stopDrag() {
        draggedNode = null;
        document.removeEventListener('mousemove', onDrag);
        document.removeEventListener('mouseup', stopDrag);
    }

    function updateText(id, value) {
        let node = nodes.find(n => n.id === id);
        if(node) {
            node.text = value;
            ceData[currentTopic].nodes = nodes;
        }
    }

    function setStatus(id, status, event) {
        event.stopPropagation(); 
        let node = nodes.find(n => n.id === id);
        if(node) {
            node.status = status;
            ceData[currentTopic].nodes = nodes;
            
            let nodeEl = document.getElementById(id);
            if(nodeEl) {
                nodeEl.className = `node ${node.parentId === null ? 'root' : ''} status-${status}`;
                let btns = nodeEl.querySelectorAll('.btn-status');
                btns.forEach(b => b.classList.remove('active'));
                let activeBtn = nodeEl.querySelector('.btn-status.' + status);
                if(activeBtn) activeBtn.classList.add('active');
                
                let sbox = document.getElementById('status_box_' + id);
                if(sbox) sbox.classList.add('hidden-click');
            }
        }
    }

    // --- 🌟 ระบบบันทึก (Save) 🌟 ---
    function exportHTML() {
        saveCurrentState(); // บันทึกข้อมูลที่กำลังพิมพ์อยู่ล่าสุด
        
        // ยัดข้อมูล Data Store ใหม่ใส่ลงไปใน Script เพื่อให้จำค่าได้ตลอดไป
        let storeData = { currentTopic: currentTopic, topics: ceData };
        document.getElementById('ce-data-store').textContent = JSON.stringify(storeData, null, 4);

        let htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
        let blob = new Blob([htmlContent], { type: 'text/html' });
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'ce_analysis.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        alert("✅ ดาวน์โหลดไฟล์เรียบร้อย! (นำไปอัปโหลดทับไฟล์เดิมบน GitHub ได้เลย)");
    }

    window.onload = initApp;

</script>
